# Harbor Engineering — a GitNodes demo knowledge base.
#
# A fictional payments company's engineering knowledge, modelled as a graph:
# decisions govern systems, systems fail, incidents get postmortems, postmortems
# produce issues, and issues sometimes produce the next decision. That loop is
# the point — it is the context an engineer reconstructs by hand every time they
# ask "why is this built this way, and what did it cost us?"
#
# The relationships live in each note's YAML frontmatter (`link_fields`), so
# GitNodes draws them as typed edges you can toggle in the canvas legend — the
# thing a folder of plain markdown cannot do, and the thing an agent walking
# this repo over MCP follows instead of grepping blind.
#
# Everything here is optional; a repo with no .gitnodes.yml uses a built-in
# default. This file is itself part of the demo: read it to see how a taxonomy
# is declared.

default_type: concept

node_types:
  - name: adr
    label: Decision
    directory: decisions
    accent: "#8b5cf6"
    title_key: title
    body_label: Decision Record
    link_fields:
      supersedes: adr         # the decision this one replaces
      affects: system         # systems this decision constrains (a list)
      written_by: person
      owned_by: team

  - name: system
    label: System
    directory: systems
    accent: "#38bdf8"
    title_key: title
    body_label: Service Notes
    link_fields:
      owned_by: team
      depends_on: system      # runtime dependencies (a list)
      runbooks: runbook       # operational procedures (a list)
      governed_by: adr        # decisions that shaped it (a list)

  - name: incident
    label: Incident
    directory: incidents
    accent: "#ef4444"
    title_key: title
    body_label: Timeline
    link_fields:
      affected: system        # blast radius (a list)
      runbook_used: runbook   # what responders reached for
      commander: person
      postmortem: postmortem

  - name: postmortem
    label: Postmortem
    directory: postmortems
    accent: "#fb7185"
    title_key: title
    body_label: Analysis
    link_fields:
      incident: incident
      written_by: person
      root_cause_in: system
      contributing_decision: adr   # the decision that set the trap
      action_items: issue          # what it produced (a list)

  - name: runbook
    label: Runbook
    directory: runbooks
    accent: "#f59e0b"
    title_key: title
    body_label: Procedure
    link_fields:
      system: system
      owned_by: team

  - name: issue
    label: Issue
    directory: issues
    accent: "#22c55e"
    title_key: title
    body_label: Ticket
    link_fields:
      system: system
      from_postmortem: postmortem  # the postmortem that filed it
      assignee: person
      resulted_in: adr             # work that produced a new decision

  - name: team
    label: Team
    directory: teams
    accent: "#0ea5e9"
    title_key: title
    body_label: Charter
    link_fields:
      lead: person

  - name: person
    label: Person
    directory: people
    accent: "#2dd4bf"
    title_key: title
    body_label: Profile
    link_fields:
      team: team

  - name: concept
    label: Concept
    directory: concepts
    accent: "#84cc16"
    title_key: title
    body_label: Explainer

  - name: tag
    label: Tag
    directory: ""
    accent: "#64748b"
    creatable: false

# Saved views are named, pre-filtered slices shown in the sidebar.
views:
  - name: "Tour: start here"
    slug: tour
    weight: -20
    tags: [featured]
  - name: "The 11 March outage"
    slug: outage-2026-03-11
    weight: -10
    tags: [outage-2026-03-11]
  - name: Systems & owners
    slug: systems-owners
    types: [system, team]
  - name: Decisions
    slug: decisions
    types: [adr]
  - name: Incidents & postmortems
    slug: incidents
    types: [incident, postmortem]
  - name: Open work
    slug: open-work
    types: [issue]
